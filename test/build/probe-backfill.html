<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>
<div id="out">未运行</div>
<script>
fetch('seed.json').then(r=>r.json()).then(seed=>{
  localStorage.setItem('jiadi.data.v1', JSON.stringify(seed));
  const f=document.createElement('iframe');
  f.id='f'; f.src='http://127.0.0.1:8899/jiadi-ui.html';
  f.style.cssText='width:1200px;height:900px;border:0';
  f.onload=()=>setTimeout(run,1800);
  document.body.appendChild(f);
});
window.run=function(){
  const w=document.getElementById('f').contentWindow, d=w.document, log=[], errs=[];
  const ev = c => { try { return w.eval(c); } catch(e){ return 'ERR:'+e.message; } };
  w.addEventListener('error', e=>errs.push(e.message));
  const before=(()=>{const db=JSON.parse(localStorage.getItem('jiadi.data.v1')); return {
    snaps:db.snapshots.map(s=>s.month), a0:db.accounts[0].amount, h0:(db.accounts[0].history||[]).length};})();
  log.push('提交前 快照='+before.snaps.join(',')+' 账户0='+before.a0+' hist='+before.h0);

  ev("S.view='checkin'; S.checkin={step:1,values:{},jumpsOk:false,date:'2026-10-15'}; renderCurrent();");
  // 只改第一个输入框对应的账户（用其自身当前值 -1 万，避免触发跳变）
  const ins=[...d.querySelectorAll('#v-checkin input[data-id]')];
  const id=ins[0].dataset.id;
  const cur=ev(`(ACCOUNTS.find(a=>a.id==='${id}')||{}).amount`);
  const nv=(cur-10000).toString();
  ins[0].value=nv; ins[0].dispatchEvent(new w.Event('input',{bubbles:true}));
  log.push('改 '+id+' 从 '+cur+' → '+nv);
  d.querySelector('#nextStep').click();

  setTimeout(()=>{
    if(d.querySelector('#jumpOk')) { d.querySelector('#jumpOk').checked=true; d.querySelector('#jumpOk').dispatchEvent(new w.Event('change',{bubbles:true})); log.push('已勾选跳变确认'); }
    const sb=d.querySelector('#submitStep');
    log.push('submit disabled='+sb.disabled);
    if(sb.disabled){ document.getElementById('out').textContent='RESULT::仍禁用 | '+log.join(' | '); return; }
    sb.click();
    setTimeout(()=>{
      const db=JSON.parse(localStorage.getItem('jiadi.data.v1'));
      log.push('提交后 快照='+db.snapshots.map(s=>s.month+'@'+s.date).sort().join(','));
      const a0=db.accounts.find(a=>a.id===id);
      log.push('该账户 hist='+(a0.history||[]).length+'条 amount='+a0.amount+' date='+a0.date);
      log.push('明细='+(a0.history||[]).map(h=>h.date+':'+h.amount).join(' → '));
      log.push('当前值未被历史覆盖='+(a0.amount===cur?'✓':'✗ 变成'+a0.amount));
      log.push('完成页='+(d.querySelector('.summary-card')?'有':'无'));
      log.push('errs='+errs.length);
      document.getElementById('out').textContent='RESULT::'+log.join(' | ');
    },1200);
  },800);
};
</script></body></html>
