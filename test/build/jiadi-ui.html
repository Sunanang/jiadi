    if(a === 'close') modal({
      title:'关闭账户？', desc:'从总额与盘点里剔除，余额及历史保留，账户移入「已关闭」区，可在详情恢复。',
      okText:'关闭账户', danger:true,
      onOk: async()=>{
        const acc = ACCOUNTS.find(x=>x.id===$('#drawer').dataset.acctId);
        if(acc){ acc.closedInNet = acc.inNet; acc.closed = true; acc.closedAt = todayStr(); acc.inNet = false; }
        if(!await saveDB()) return;
        if(acc) logIt('关闭账户',acc.name);
        closeDrawer(); renderAll(); toast('账户已关闭');
      } });
    if(a === 'reopen'){
      const acc=ACCOUNTS.find(x=>x.id===$('#drawer').dataset.acctId);
      if(!acc) return;
      acc.closed=false; acc.closedAt=''; acc.inNet=acc.closedInNet!==false;
      if(!await saveDB()) return;
      logIt('恢复账户',acc.name); closeDrawer(); renderCurrent(); toast('账户已恢复，余额请核对');
    }
    if(a === 'archive'){
      const who = $('#drawer').dataset.member;
      const own = ACCOUNTS.filter(x=>x.member===who);
      modal({ title:'归档成员？', desc:`「${esc(who)}」名下 ${own.length} 个账户将转为「共同」，成员移入已归档、只读。`, okText:'归档', danger:true,
        onOk: async()=>{
          const net=byMember().find(m=>m.name===who)?.net || 0;
          if(own.length && !MEMBERS.some(m=>m.name==='共同')) MEMBERS.push({name:'共同',shared:true,color:'#9CA3AF',colorDark:'#8B94A1'});
          own.forEach(x=>{ x.member = '共同'; });
          const m = MEMBERS.find(x=>x.name===who);
          if(m){
            MEMBERS = MEMBERS.filter(x=>x.name!==who);
            ARCHIVED.push({ id:'z'+randHex(12), name:who, accounts:own.length, net, note:todayStr()+' 归档 · 名下账户已转共同' });
          }
          if(!await saveDB()) return;
          logIt('归档成员', `${who} · ${own.length} 个账户转共同`); closeDrawer(); renderCurrent(); toast(`已归档「${who}」，${own.length} 个账户转为共同`);
        } });
    }
    if(a === 'renameMember'){
      const who = $('#drawer').dataset.member;
      modal({ title:'成员改名', desc:'名下账户的归属会一起改；历史汇总快照保持原值。', input:'新名称', placeholder:'新名称', okText:'保存',
        onOk: async(v)=>{
          const name = (v||'').trim();
          if(!name || name.length>80){ toast('请填写不超过 80 字的名称'); return; }
          if(MEMBERS.some(x=>x.name===name && x.name!==who)){ toast('已有同名成员'); return; }
          const m = MEMBERS.find(x=>x.name===who);
          if(m){ m.name = name; m.shared=name==='共同'; }
          ACCOUNTS.forEach(x=>{ if(x.member===who) x.member = name; });
          if(!await saveDB()) return;
          logIt('成员改名', `${who} → ${name}`); closeDrawer(); renderCurrent(); toast('已改名'); } });
    }
    if(a === 'addAcct'){ const who = $('#drawer').dataset.member; closeDrawer(); setTimeout(()=>accountFormDrawer(null, who), 180); }
  });
  $$('#drawerBody [data-acct]').forEach(el=>el.onclick = async()=>{
    const id = el.dataset.acct;
    closeDrawer();
    setTimeout(()=> accountDrawer(id), 180);
  });
}

      <h1>报告</h1><span class="sub">只读 · 可加密导出</span>
      <div class="right"><button class="btn sm" data-go="home">返回首页</button></div>
    </div>
    <div class="rp">
      <div class="rp-top"><b>家底</b><span>${last==='—'?'尚无账户记录':last.slice(0,7).replace('-',' 年 ')+' 月 · 最新账户记录 '+last}</span></div>
      <div class="rp-net">¥ ${fmtY(t.N)}</div>
      <div class="rp-sub">净资产 · ${insight}</div>

      <div class="rp-cells">
        <div><div class="l">总资产</div><div class="v">${fmtY(t.A)}</div></div>
        <div><div class="l">总负债</div><div class="v" style="color:var(--debt)">${fmtY(t.L)}</div></div>
        <div><div class="l">负债率</div><div class="v">${t.A? (t.L/t.A*100).toFixed(1)+'%' : '—'}</div></div>
      </div>

      <div class="rp-ring">${donutSVG(items)}</div>
      <div class="rp-legend">
        ${items.map(i=>`<span style="display:inline-flex;align-items:center;gap:6px"><i style="width:8px;height:8px;border-radius:2px;background:${i.color}"></i>${esc(i.name)} ${i.pct.toFixed(1)}%</span>`).join('')}
      </div>

      <div class="rp-note">共 ${ACCOUNTS.length} 个账户 · ${MEMBERS.length} 名成员<br>数据保存在共享服务中，电脑和手机使用同一份账本</div>
      <div class="rp-foot">
        <button class="btn sm" id="rpCopy">复制摘要</button>
        <button class="btn sm primary" id="rpPrint">${SHARED?'导出加密报告':'打印 / 存为 PDF'}</button>
      </div>
    </div>`;

  $('#rpCopy').onclick = async()=>{
    const txt = `家底 · ${last}\n净资产 ¥${fmtY(t.N)}\n总资产 ¥${fmtY(t.A)}　总负债 ¥${fmtY(t.L)}\n${insight}`;
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(()=>toast('摘要已复制'), ()=>toast('复制失败，请手动选择'));
    }else{ toast('当前环境不支持剪贴板'); }
  };
  $('#rpPrint').onclick = ()=>{
    if(!SHARED){window.print();return;}
    const report=$('#v-report .rp').cloneNode(true);report.querySelector('.rp-foot')?.remove();
    const page='<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>家底报告</title><style>'+document.querySelector('style').textContent+'</style><body>'+report.outerHTML+'</body></html>';
    return downloadBlob(new Blob([page],{type:'text/html;charset=utf-8'}),'jiadi-report-'+todayStr()+'.html');
  };
}

/* =========================================================
   P0 首次引导（4 步，可跳过，记住已看过）
   ========================================================= */
const P0_KEY = 'jiadi.onboarded.v1';
let onbStep = 0;
const ONB = [
  { h:'这是你的家底', p:'一个只管一件事的账本：<span class="em">每月记一次余额</span>，然后把「我到底有多少钱」算清楚。',
    list:['不记流水、不做预算、不连银行', '电脑和手机共用服务端同一份账本', '使用同一个账本密码登录'] },
  { h:'记什么', p:'只记<span class="em">账户的余额</span>，不记每一笔花销。',
    list:['现金、存款、投资、房产——都算账户', '房贷、信用卡——也建账户，标记为负债', '净资产 = 总资产 − 总负债'] },
  { h:'怎么记', p:'每月找个时间，点「盘点」，把每个账户的当前余额填一遍。',
    list:['系统会记住上次的值，没变就留空', '变化超过阈值会让你确认，防手滑', '一次盘点生成一个快照，曲线就是这么来的'] },
  { h:'可以开始了', p:'先建一个账户，或者先用演示数据看看长什么样。',
    list:[] }
];
function needOnboarding(){
  try{ return !localStorage.getItem(P0_KEY); }catch(e){ return false; }
}
function markOnboarded(){ try{ localStorage.setItem(P0_KEY, '1'); }catch(e){} }
function renderOnb(){
  const step = ONB[onbStep];
  $('#onbDots').innerHTML = ONB.map((_,i)=>`<i class="${i<=onbStep?'on':''}"></i>`).join('');
  $('#onbBody').innerHTML = `
    <h3 id="onbTitle">${step.h}</h3>
    <p>${step.p}</p>
    ${step.list.length ? `<ul>${step.list.map(x=>`<li>${x}</li>`).join('')}</ul>` : ''}
    ${onbStep === ONB.length-1 ? `<div style="display:flex;gap:8px;margin-top:6px">
        <button class="btn primary sm" id="onbCreate">建第一个账户</button>
        <button class="btn sm" id="onbDemo">用演示数据看看</button></div>` : ''}`;
  $('#onbNext').style.display = onbStep === ONB.length-1 ? 'none' : '';
  $('#onbSkip').textContent = onbStep === ONB.length-1 ? '关闭' : '跳过';
  const c = $('#onbCreate');
  if(c) c.onclick = async()=>{ markOnboarded(); hideOnb(); show('home'); setTimeout(()=>accountFormDrawer(null), 120); };
  const d = $('#onbDemo');
  if(d) d.onclick = async()=>{ markOnboarded(); hideOnb(); show('home'); requestDemo(); };
  $('#onbNext').onclick = async()=>{ if(onbStep < ONB.length-1){ onbStep++; renderOnb(); } };
  $('#onbSkip').onclick = async()=>{ markOnboarded(); hideOnb(); };
}
function showOnb(){ onbStep = 0; renderOnb(); $('#onb').classList.add('on'); $('#onb').setAttribute('aria-hidden','false'); }
function hideOnb(){ $('#onb').classList.remove('on'); $('#onb').setAttribute('aria-hidden','true'); }

/* ---------- 启动 ---------- */
lastGoodState = clone(dataState());
const validPrefs = {...DEFAULT_PREF};
SETTINGS.forEach(sec=>sec.items.forEach(it=>{
  if(!it.key || it.key==='privacy') return;
  if(it.type==='select' && it.opts.includes(PREF[it.key])) validPrefs[it.key]=PREF[it.key];
  if(it.type==='switch' && typeof PREF[it.key]==='boolean') validPrefs[it.key]=PREF[it.key];
}));
if(typeof PREF.lastExport==='string' && /^\d{4}-\d{2}-\d{2}$/.test(PREF.lastExport)) validPrefs.lastExport=PREF.lastExport;
PREF=validPrefs;
applyTheme();
applyPrefs();
S.privacy = false;                       // 遮罩不跨页面生命周期
if(S.privacy){
  show('home');
  applyPrivacy();
  if((location.hash||'#home').slice(1) !== 'home') history.replaceState(null,'','#home');
  toast('页面处于锁定状态，请输入密码解锁');
}else{
  show((location.hash||'#home').slice(1));
}
if(storageError) setTimeout(()=>toast(storageError),300);
else if(needOnboarding()) setTimeout(()=>{if(needOnboarding() && !$('#modalMask.on') && !$('#drawer.on')) showOnb();},260);
</script>
<script>window.JIADI_TEST_LOCAL=1;</script>
<script src="./shared-client.js"></script>
