<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>页面不存在 · 家底</title>
<link rel="icon" href="assets/icon.png" />
<style>
  :root{color-scheme:dark;--bg:#0F1318;--card:#1A2029;--line:rgba(255,255,255,.09);--ink:#E6EDF5;--ink-2:#A5B3C4;--mut:#7C8A9B;--asset:#6EA3D2}
  @media (prefers-color-scheme:light){:root{color-scheme:light;--bg:#F5F7FA;--card:#FFFFFF;--line:rgba(31,58,95,.10);--ink:#1F3A5F;--ink-2:#4E5F75;--mut:#5B6B7E;--asset:#4A7BA7}}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;line-height:1.6;padding:24px}
  .box{max-width:520px;text-align:center;border:1px solid var(--line);border-radius:14px;background:var(--card);padding:40px 32px}
  img{width:56px;height:56px;border-radius:12px;margin-bottom:18px}
  h1{font-size:22px;margin:0 0 10px;font-weight:600}
  p{margin:0 0 22px;color:var(--ink-2);font-size:15px}
  a{display:inline-block;height:42px;line-height:42px;padding:0 20px;border-radius:10px;background:var(--asset);color:#fff;text-decoration:none;font-size:15px}
  a.plain{background:transparent;color:var(--ink-2);margin-left:8px}
</style>
</head>
<body>
  <div class="box">
    <img src="assets/icon.png" alt="家底" />
    <h1>这里没有这一页</h1>
    <p>地址可能写错了，或者这一页已经被搬走。回官网首页看看，或者直接去仓库。</p>
    <a href="./">回首页</a>
    <a class="plain" href="https://github.com/Sunanang/jiadi">去仓库</a>
  </div>
</body>
</html>
